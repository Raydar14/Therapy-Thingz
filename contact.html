<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Therapy Thingz</title>
<meta name="description" content="Get in touch with Therapy Thingz — questions, requests, and hellos welcome.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
<div id="site-header"></div>

<main>
  <section class="section" style="padding-top:clamp(2.5rem,5vw,4rem)">
    <div class="wrap contact-grid">
      <div>
        <p class="eyebrow">Contact</p>
        <h1 style="font-size:var(--step-3);margin:0 0 .7rem">Say hi.</h1>
        <p class="lead">Questions about an app, the book, a course, or an order — or just a hello. It all reaches me.</p>
        <div class="contact-lines">
          <a href="mailto:TherapyThingzz@gmail.com"><span><span class="lab">Email</span>TherapyThingzz@gmail.com</span></a>
          <a href="tel:+18508079801"><span><span class="lab">Phone</span>(850) 807-9801</span></a>
        </div>
      </div>

      <div>
        <!-- Formspree: replace your-form-id with your real endpoint ID -->
        <form class="form" action="https://formspree.io/f/your-form-id" method="POST" id="contact-form">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <input type="hidden" name="_subject" value="New message from Therapy Thingz">
          <button class="btn btn--primary" type="submit">Send message</button>
          <p class="form__note" id="form-status">Prefer email? Write to <a href="mailto:TherapyThingzz@gmail.com" style="color:var(--marigold-d);font-weight:700">TherapyThingzz@gmail.com</a>.</p>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/script.js"></script>
<script>
  // graceful async submit with fallback to mailto if Formspree isn't set up yet
  const form = document.getElementById('contact-form');
  const status = document.getElementById('form-status');
  form.addEventListener('submit', async (e) => {
    if (form.action.includes('your-form-id')) return; // not configured -> let it navigate/show Formspree setup
    e.preventDefault();
    status.textContent = 'Sending…';
    try{
      const res = await fetch(form.action, { method:'POST', body:new FormData(form), headers:{Accept:'application/json'} });
      if(res.ok){ form.reset(); status.textContent = 'Thanks — your message is on its way.'; }
      else { throw new Error(); }
    }catch(_){
      status.innerHTML = 'Something glitched — email me directly at <a href="mailto:TherapyThingzz@gmail.com" style="color:var(--marigold-d);font-weight:700">TherapyThingzz@gmail.com</a>.';
    }
  });
</script>
</body>
</html>
